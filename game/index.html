<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 빌드: 2026-11-24T02:37Z -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방울 — 1화 · 맹세</title>
<style>
:root {
  --paper: #14161a;
  --ink: #e8e3da;
  --accent: #b4532f;
  --line: rgba(232, 227, 218, .18);
  --box: rgba(10, 12, 16, .82);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #0b0d10;
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
}

#stage {
  position: relative;
  width: min(100vw, 1100px);
  height: min(100dvh, 620px);
  overflow: hidden;
  border-radius: 6px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
  cursor: pointer;
  user-select: none;
}

/* ── 배경 ── */
#bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity .4s ease;
}
.bg-room_night { background: radial-gradient(circle at 72% 28%, #3a2f27 0%, #1a1713 45%, #0e0d0c 100%); }
.bg-room_day   { background: linear-gradient(160deg, #d9cfc0 0%, #b9ab98 55%, #8d8071 100%); }
.bg-cafe       { background: linear-gradient(200deg, #6b5642 0%, #3d3228 60%, #241d17 100%); }
.bg-store      { background: linear-gradient(180deg, #cfe0e6 0%, #7f9aa4 60%, #4a5b63 100%); }
.bg-hall       { background: linear-gradient(180deg, #b8c2c9 0%, #7d8890 55%, #4f565c 100%); }

/* ── CG ── */
#cg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .45s ease;
  pointer-events: none;
}
#cg.on { opacity: 1; }

/* ── 캐릭터 초상 ── */
#portrait {
  position: absolute;
  left: 3.2%;
  bottom: 30%;
  width: 23%;
  max-width: 250px;
  border-radius: 10px;
  border: 1px solid var(--line);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .5);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}
#portrait.on { opacity: 1; transform: translateY(0); }

/* ── 대사창 ── */
#msgbox {
  position: absolute;
  left: 3.2%; right: 3.2%; bottom: 4.2%;
  min-height: 27%;
  padding: 22px 26px 20px;
  background: var(--box);
  border: 1px solid var(--line);
  border-radius: 4px;
  backdrop-filter: blur(3px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#nameplate {
  position: absolute;
  top: -17px; left: 18px;
  padding: 3px 14px;
  font-size: 14px;
  letter-spacing: .08em;
  color: var(--ink);
  background: var(--accent);
  border-radius: 3px;
  opacity: 0;
  transition: opacity .2s;
}
#nameplate.on { opacity: 1; }

#text {
  font-size: calc(clamp(15px, 1.55vw, 18px) + var(--fsx, 0px));
  line-height: 1.95;
  letter-spacing: .01em;
  white-space: pre-wrap;
  word-break: keep-all;
  min-height: 3.9em;
}

#msgbox.hide { opacity: 0; pointer-events: none; }
#msgbox { transition: opacity .3s; }

/* ── 선택지 ── */
#choices {
  position: absolute;
  left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  width: min(70%, 640px);
  display: none;
  flex-direction: column;
  gap: 10px;
}
#choices.on { display: flex; }

.choice {
  font: inherit;
  font-size: calc(16px + var(--fsx, 0px));
  color: var(--ink);
  background: rgba(12, 14, 18, .9);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  text-align: left;
  cursor: pointer;
  transition: background .15s, transform .12s, border-color .15s;
}
.choice:hover {
  background: rgba(180, 83, 47, .22);
  border-color: rgba(180, 83, 47, .55);
  transform: translateX(3px);
}

/* ── 툴바 ── */
#toolbar {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
#toolbar button {
  font: inherit;
  font-size: 12px;
  color: rgba(232, 227, 218, .78);
  background: rgba(10, 12, 16, .62);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
}
#toolbar button:hover { color: #fff; border-color: rgba(232, 227, 218, .45); }
#toolbar button.on { color: #fff; background: var(--accent); border-color: var(--accent); }

#hint {
  position: absolute;
  right: 18px; bottom: 10px;
  font-size: 11px;
  letter-spacing: .06em;
  color: rgba(232, 227, 218, .38);
}

/* ── 엔드 패널 ── */
#endpanel {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(8, 9, 12, .9);
  text-align: center;
  padding: 40px;
}
#endpanel.on { display: flex; }
#endtitle {
  font-family: "Noto Serif KR", Georgia, serif;
  font-size: clamp(24px, 3vw, 34px);
  letter-spacing: .04em;
}
#endtext { font-size: 15px; line-height: 1.9; color: rgba(232, 227, 218, .82); max-width: 46em; }
#endstats { font-size: 12px; letter-spacing: .1em; color: var(--accent); }

/* ── 백로그 ── */
#backlog {
  position: absolute;
  inset: 0;
  display: none;
  background: rgba(6, 7, 10, .94);
  z-index: 10;
  padding: 56px 6% 40px;
  overflow-y: auto;
  cursor: pointer;
}
#backlog.on { display: block; }
#backloghead {
  position: sticky;
  top: 0;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 4px 0 10px;
  margin-bottom: 8px;
  background: linear-gradient(rgba(6, 7, 10, .98), rgba(6, 7, 10, .92));
  border-bottom: 1px solid var(--line);
  font-size: 12px; letter-spacing: .06em; color: rgba(232, 227, 218, .6);
  cursor: default;
}
#btn-backlog-close {
  font: inherit; font-size: 12px;
  color: rgba(232, 227, 218, .8);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 4px 10px;
  cursor: pointer;
}
#btn-backlog-close:hover { color: #fff; border-color: rgba(232, 227, 218, .45); }
#backloglist { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: auto; padding-bottom: 24px; }
.bl-row { font-size: 14px; line-height: 1.8; color: rgba(232, 227, 218, .8); }
.bl-name { color: var(--accent); margin-right: 10px; font-size: 12px; letter-spacing: .06em; }

@media (max-width: 700px) {
  #stage { border-radius: 0; }
  #msgbox { min-height: 34%; padding: 16px 18px; }
  #choices { width: 86%; top: 42%; }
}


/* ── 공용 패널 (저장/설정/엔딩) ── */
#panel {
  position: absolute; inset: 0;
  z-index: 12;
  display: none;
  background: rgba(6, 7, 10, .92);
  padding: 40px 4%;
  overflow-y: auto;
  cursor: default;
}
#panel.on { display: flex; align-items: flex-start; justify-content: center; }
.panel-inner {
  width: min(100%, 560px);
  margin: auto;
  background: #14161a;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 18px 20px 16px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
#panel-title { font-size: 15px; letter-spacing: .05em; }
#panel-close {
  font: inherit; font-size: 12px;
  color: rgba(232, 227, 218, .8);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 4px 10px;
  cursor: pointer;
}
#panel-close:hover { color: #fff; border-color: rgba(232, 227, 218, .45); }

.slot { display: flex; gap: 8px; margin-bottom: 8px; }
.slot-main {
  flex: 1;
  display: flex; align-items: baseline; gap: 12px;
  font: inherit; font-size: 14px;
  color: var(--ink);
  background: rgba(12, 14, 18, .9);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
}
.slot-main:hover { background: rgba(180, 83, 47, .18); }
.slot-main.empty { color: rgba(232, 227, 218, .45); border-left-color: rgba(232, 227, 218, .2); }
.slot-main:disabled { cursor: default; opacity: .55; }
.slot-main:disabled:hover { background: rgba(12, 14, 18, .9); }
.slot-no { font-size: 12px; letter-spacing: .06em; color: var(--accent); white-space: nowrap; }
.slot-main.empty .slot-no { color: inherit; }
.slot-info { font-size: 13px; color: rgba(232, 227, 218, .82); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-del {
  font: inherit; font-size: 12px;
  color: rgba(232, 227, 218, .55);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 10px;
  cursor: pointer;
}
.slot-del:hover { color: #fff; border-color: rgba(180, 83, 47, .6); }

.set-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed rgba(232, 227, 218, .1);
}
.set-label { font-size: 14px; color: rgba(232, 227, 218, .85); }
.set-ctrl { display: flex; align-items: center; gap: 6px; }
.set-ctrl button {
  font: inherit; font-size: 12px;
  color: rgba(232, 227, 218, .8);
  background: rgba(10, 12, 16, .7);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
}
.set-ctrl button:hover { color: #fff; }
.set-ctrl button.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.set-val { font-size: 13px; min-width: 3.4em; text-align: center; color: var(--accent); }

.ending {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 2px;
  border-bottom: 1px dashed rgba(232, 227, 218, .1);
}
.ending-no { font-size: 12px; color: var(--accent); letter-spacing: .06em; padding-top: 2px; }
.ending-body { display: flex; flex-direction: column; gap: 3px; }
.ending-title { font-size: 14px; }
.ending-sub { font-size: 12px; color: rgba(232, 227, 218, .5); }
.ending.locked .ending-no { color: rgba(232, 227, 218, .25); }
.ending.locked .ending-title { color: rgba(232, 227, 218, .35); }

.panel-note { font-size: 12px; color: rgba(232, 227, 218, .45); margin: 12px 0 0; line-height: 1.7; }

/* ── 엔드 패널 버튼 ── */
.endbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.endbtns button {
  font: inherit; font-size: 13px;
  color: var(--ink);
  background: rgba(180, 83, 47, .18);
  border: 1px solid rgba(180, 83, 47, .5);
  border-radius: 3px;
  padding: 8px 16px;
  cursor: pointer;
}
.endbtns button:hover { background: var(--accent); color: #fff; }

@media (max-width: 700px) {
  #toolbar { flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
  #panel { padding: 24px 3%; }
  .slot-main { flex-direction: column; gap: 4px; }
  .set-row { flex-direction: column; align-items: flex-start; gap: 6px; }
}

</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="bg bg-room_night"></div>
  <img id="cg" alt="">
  <img id="portrait" alt="">

  <div id="toolbar">
    <button id="btn-save">저장</button>
    <button id="btn-load">불러오기</button>
    <button id="btn-log">백로그</button>
    <button id="btn-auto">자동</button>
    <button id="btn-skip">스킵</button>
    <button id="btn-endings">엔딩</button>
    <button id="btn-settings">설정</button>
    <button id="btn-restart">처음부터</button>
  </div>

  <div id="choices"></div>

  <div id="msgbox">
    <div id="nameplate"></div>
    <div id="text"></div>
  </div>
  <div id="hint">클릭 또는 Space</div>

  <div id="endpanel">
    <div id="endtitle"></div>
    <div id="endtext"></div>
    <div id="endstats"></div>
    <div class="endbtns">
      <button id="btn-end-restart">다시 시작</button>
      <button id="btn-end-next">다음 화</button>
      <button id="btn-end-list">엔딩 목록</button>
      <button id="btn-end-load">불러오기</button>
    </div>
  </div>

  <div id="backlog">
    <div id="backloghead">
      <span id="backlogcount"></span>
      <button id="btn-backlog-close">닫기</button>
    </div>
    <div id="backloglist"></div>
  </div>

  <div id="panel">
    <div class="panel-inner">
      <div class="panel-head">
        <span id="panel-title"></span>
        <button id="panel-close">닫기</button>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>
</div>
<script>
/* 쯔꾸르식 스토리게임 코어 — 순수 로직(브라우저/테스트 공용)
 * 노드 타입: text / choice / end
 * 상태: { id, flags, visited, stats }
 */
(function (global) {
  'use strict';

  var CORE = {
    VERSION: '0.1.0',

    start: function (sc) {
      var ch = (sc.chapters && sc.chapters.length) ? sc.chapters[0].id : 1;
      return { id: sc.start, flags: {}, visited: [], stats: { obey: 0, resist: 0 }, chapter: ch };
    },

    node: function (sc, st) {
      var n = sc.nodes[st.id];
      if (!n) throw new Error('NODE_NOT_FOUND: ' + st.id);
      return n;
    },

    /** 조건 평가: {flag:'x'} / {flag:'x', is:true} / {not:{flag:'x'}} / {all:[...]} */
    test: function (cond, flags) {
      if (!cond) return true;
      if (cond.all) return cond.all.every(function (c) { return CORE.test(c, flags); });
      if (cond.any) return cond.any.some(function (c) { return CORE.test(c, flags); });
      if (cond.not) return !CORE.test(cond.not, flags);
      var v = flags[cond.flag];
      if ('is' in cond) return v === cond.is;
      return !!v;
    },

    /** 현재 노드에서 고를 수 있는 선택지 목록 */
    choices: function (sc, st) {
      var n = CORE.node(sc, st);
      if (n.type !== 'choice') return [];
      return (n.options || []).map(function (o, i) {
        return { index: i, text: o.text, enabled: CORE.test(o.cond, st.flags) };
      }).filter(function (o) { return o.enabled; });
    },

    /** 텍스트 노드 진행 → 다음 상태 (cond 실패 노드는 자동 건너뜀) */
    advance: function (sc, st) {
      var n = CORE.node(sc, st);
      if (n.type === 'choice') throw new Error('CHOICE_REQUIRED: ' + st.id);
      if (n.type === 'end') return st;
      var ns = CORE.clone(st);
      if (ns.visited.indexOf(st.id) < 0) ns.visited.push(st.id);
      if (n.set) CORE.applySet(ns, n.set);
      ns.id = n.next;
      var guard = 0;
      while (true) {
        if (!sc.nodes[ns.id]) throw new Error('DEAD_END: ' + n.id + ' -> ' + ns.id);
        var nx = sc.nodes[ns.id];
        if (nx.type === 'text' && !CORE.test(nx.cond, ns.flags)) {
          if (ns.visited.indexOf(nx.id) < 0) ns.visited.push(nx.id);
          ns.id = nx.next;
          if (++guard > 200) throw new Error('COND_LOOP: ' + ns.id);
          continue;
        }
        break;
      }
      return ns;
    },

    /** 선택지 선택 → 다음 상태 */
    choose: function (sc, st, index) {
      var n = CORE.node(sc, st);
      if (n.type !== 'choice') throw new Error('NOT_CHOICE: ' + st.id);
      var avail = CORE.choices(sc, st);
      var picked = null;
      for (var k = 0; k < avail.length; k++) if (avail[k].index === index) picked = avail[k];
      if (!picked) throw new Error('OPTION_UNAVAILABLE: ' + index);
      var o = n.options[index];
      var ns = CORE.clone(st);
      if (ns.visited.indexOf(st.id) < 0) ns.visited.push(st.id);
      if (o.set) CORE.applySet(ns, o.set);
      if (o.stat) {
        if (o.stat.obey) ns.stats.obey += o.stat.obey;
        if (o.stat.resist) ns.stats.resist += o.stat.resist;
      }
      ns.id = o.next;
      if (!sc.nodes[ns.id]) throw new Error('DEAD_END: ' + n.id + ' -> ' + o.next);
      return ns;
    },

    applySet: function (ns, set) {
      Object.keys(set).forEach(function (k) { ns.flags[k] = set[k]; });
    },

    clone: function (st) {
      return {
        id: st.id,
        flags: JSON.parse(JSON.stringify(st.flags)),
        visited: st.visited.slice(),
        stats: { obey: st.stats.obey, resist: st.stats.resist },
        chapter: st.chapter || 1
      };
    },

    isEnd: function (sc, st) { return CORE.node(sc, st).type === 'end'; },

    /** 시나리오 무결성 검사 */
    validate: function (sc) {
      var errs = [];
      if (!sc.start) errs.push('start 없음');
      if (!sc.nodes[sc.start]) errs.push('start 노드 없음: ' + sc.start);
      var targets = {};
      Object.keys(sc.nodes).forEach(function (id) {
        var n = sc.nodes[id];
        if (n.type === 'text') {
          if (!n.next) errs.push(id + ': next 없음');
          else targets[n.next] = true;
        } else if (n.type === 'choice') {
          if (!n.options || !n.options.length) errs.push(id + ': 선택지 없음');
          (n.options || []).forEach(function (o, i) {
            if (!o.next) errs.push(id + ' option ' + i + ': next 없음');
            else targets[o.next] = true;
          });
        } else if (n.type === 'end') {
          /* 종단 */
        } else {
          errs.push(id + ': 알 수 없는 타입 ' + n.type);
        }
      });
      Object.keys(targets).forEach(function (t) {
        if (!sc.nodes[t]) errs.push('없는 노드를 가리킴: ' + t);
      });
      return errs;
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = CORE;
  global.SunaeCore = CORE;
})(typeof window !== 'undefined' ? window : this);


/* 시나리오 데이터 — 1화 「맹세」 (쯔꾸르식)
 * bg: room_night / room_day / cafe / store / hall
 * 씬은 텍스트 노드의 bg/cg로 바뀐다. 없으면 이전 것을 유지.
 */
(function (global) {
  'use strict';

  var SC = {
    title: '방울 — 1화 · 맹세',
    start: 'n01',
    chapters: [
      { id: 1, title: '맹세', start: 'n01' },
      { id: 2, title: '앉아', start: 'm01' }
    ],
    nodes: {
      /* ── 1부 · 쿠라 시점 ── */
      n01: { type: 'text', bg: 'room_night', speaker: '', text: '버클이 잠기는 소리가 났다. 그 소리 하나로 방의 공기가 바뀌었다.', next: 'n02' },
      n02: { type: 'text', text: '스탠드 빛이 낮게 깔려 있었다. 목덜미에 가죽이 닿아 있었고, 그는 손가락 두 개를 넣어 여유를 확인했다.', next: 'n03' },
      n03: { type: 'text', text: '여유가 남아 있는 것을 보고 나서야 손을 뗐다. 손을 떼고 나서도 그 자리를 한 번 더 눌러 보았다.', next: 'n04' },
      n04: { type: 'text', text: '이 장면은 오늘 처음 시작된 것이 아니었다.', next: 'n05' },

      n05: { type: 'text', bg: 'room_day', text: '사흘 전, 그는 아주 작은 것을 물었다. "오늘 저녁은 내가 골라도 돼?" 선배는 웃으면서 넘겼다.', next: 'n06' },
      n06: { type: 'text', text: '이틀 전에는 "몇 시에 잘지 정해 줘도 돼?"라고 물었고, 어제는 "내일 입을 옷, 내가 골라 줘도 돼?"라고 물었다.', next: 'n07' },
      n07: { type: 'text', text: '매번 넘겼고, 넘길 때마다 대답이 반 발짝씩 빨라졌다. 그는 그 반 발짝을 세고 있었다.', next: 'n08' },
      n08: { type: 'text', bg: 'room_night', text: '재촉하지 않았다. 재촉하면 상대가 물러서고, 물러서면 처음부터 다시 시작해야 했다.', next: 'n09' },
      n09: { type: 'text', text: '오늘은 큰 것을 꺼낼 차례였다.', next: 'n10' },

      n10: { type: 'text', speaker: '쿠라', text: '형, 하나만 물어볼게.', next: 'n11' },
      n11: { type: 'text', text: '맞은편에서 고개가 조금 기울었다. 대답 대신이라는 것이 그 방의 습관이었다.', next: 'n12' },
      n12: { type: 'text', speaker: '쿠라', text: '형이 정하지 않아도 되는 일, 나한테 맡겨 봐. 하루만. 아니면 한 시간만.', next: 'n13' },
      n13: { type: 'text', text: '꼬리 끝이 아주 작게 흔들렸다. 대답이 바로 나오지 않았고, 그는 그 침묵을 재촉하지 않았다.', next: 'n14' },
      n14: { type: 'text', speaker: '도화', text: '그런 거, 아무한테나 맡기는 거 아니야.', next: 'n15' },

      n15: {
        type: 'choice',
        prompt: '어떻게 답할까.',
        options: [
          { text: '"알아. 그래서 형한테 물어."', next: 'n16', stat: { obey: 1 }, set: { firm: true } },
          { text: '"그럼 안 해도 돼. 나는 안 급해."', next: 'n17', stat: { resist: 1 }, set: { soft: true } }
        ]
      },

      n16: { type: 'text', speaker: '쿠라', text: '알아. 그래서 형한테 물어.', next: 'n18' },
      n17: { type: 'text', speaker: '쿠라', text: '그럼 안 해도 돼. 나는 안 급해.', next: 'n18' },

      n18: { type: 'text', text: '그는 몸을 조금 앞으로 기울였다가 다시 물러났다. 물러서는 것이 가장 세게 미는 방법이라는 것을 그는 이미 알고 있었다.', next: 'n19' },
      n19: { type: 'text', speaker: '쿠라', text: '싫으면 지금 말해. 안 해도 돼.', next: 'n20' },
      n20: { type: 'text', text: '입을 다물었다. 이 침묵은 기다림이 아니라 자리를 비워 주는 침묵이었다.', next: 'n21' },
      n21: { type: 'text', speaker: '도화', text: '하지 않을 건 내가 정할게.', next: 'n22' },
      n22: { type: 'text', text: '무릎 위에 얹었던 손이 조금 내려놓였다.', next: 'n23' },
      n23: { type: 'text', speaker: '쿠라', text: '그거면 돼.', next: 'n24' },
      n24: { type: 'text', speaker: '쿠라', text: '한 번 더.', next: 'n25' },
      n25: { type: 'text', speaker: '도화', text: '뭐, 이런 거?', next: 'n26' },
      n26: { type: 'text', text: '목소리에 웃음이 섞여 있었다.', next: 'n27' },

      n27: {
        type: 'choice',
        prompt: '웃음이 섞인 대답 앞에서.',
        options: [
          { text: '"장난 말고. 제대로."', next: 'n28', stat: { obey: 1 }, set: { twice: true } },
          { text: '"……됐어."', next: 'n29', stat: { resist: 1 }, set: { once: true } }
        ]
      },

      n28: { type: 'text', speaker: '쿠라', text: '장난 말고. 제대로.', next: 'n30' },
      n29: { type: 'text', speaker: '쿠라', text: '……됐어.', next: 'n33' },

      n30: { type: 'text', text: '한숨이 들렸다. 그 한숨이 짜증인지 체념인지 그는 구분하지 않았다. 어느 쪽이든 결과는 같았다.', next: 'n31' },
      n31: { type: 'text', speaker: '쿠라', text: '소리 내서.', next: 'n32' },
      n32: { type: 'text', speaker: '도화', text: '……알겠어.', next: 'n34' },

      n33: { type: 'text', speaker: '도화', text: '알겠어.', next: 'n37b' },

      n34: { type: 'text', text: '고개가 들렸다. 노란 눈이 스탠드 빛을 받아 조금 밝아졌고, 그 눈이 흔들리다가 멈췄다.', next: 'n35' },
      n35: { type: 'text', speaker: '도화', text: '맡을게. 판단도, 몸도.', next: 'n36' },
      n36: {
        type: 'text',
        cond: { flag: 'twice' },
        text: '"한 번 더." 두 번째는 조금 더 낮은 목소리로 나왔다. "맡을게. 판단도, 몸도. 내가 정하지 않아도 되는 건 네가 정해."',
        next: 'n37a'
      },
      n37a: { type: 'text', text: '두 번 시킨 것은 취향이었다. 한 번이면 약속이고, 두 번이면 각인이었다. 세 번이면 그 말이 이 사람의 것이 아니라 자기 것이 된다.', next: 'n38' },
      n38: { type: 'text', text: '그는 그날 밤 두 번으로 만족했다. 다음에 또 시킬 생각을 하면서.', next: 'n39' },
      n37b: { type: 'text', text: '한 번으로 끝냈다. 그는 그날 밤 한 번으로 만족했다. 다음에 또 시킬 생각을 하면서.', next: 'n39' },

      n39: { type: 'text', speaker: '쿠라', text: '무릎.', next: 'n40' },
      n40: { type: 'text', text: '한마디를 내고 입을 다물었다. 침묵이 명령의 나머지였다.', next: 'n41' },
      n41: { type: 'text', text: '바닥에 무릎이 닿는 소리가 그 다음에 왔고, 그는 바로 다음 말을 하지 않았다. 그 몇 초가 방의 구조를 바꾸었다.', next: 'n42' },
      n42: { type: 'text', speaker: '쿠라', text: '손.', next: 'n43' },
      n43: { type: 'text', text: '손이 내밀어졌다. 그는 그 손을 잡아 조금 들어 올리고, 옆 책상에서 목줄을 꺼내 목덜미에 둘렀다.', next: 'n44' },
      n44: { type: 'text', text: '가죽이 목에 닿자 털이 눌리고, 버클이 잠기는 소리가 아주 작게 났다.', next: 'n45' },
      n45: { type: 'text', speaker: '쿠라', text: '눈.', next: 'n46' },
      n46: { type: 'text', text: '고개가 들렸다. 눈이 마주쳤다가 조금 흔들렸다. 그는 손가락으로 턱을 잡아 각도를 유지했다.', next: 'n47' },
      n47: { type: 'text', text: '도망가지 못하게 하는 것이 아니라, 도망가지 않아도 된다는 것을 알려 주는 손이었다.', next: 'n48' },
      n48: { type: 'text', speaker: '쿠라', text: '잘했어.', next: 'n49' },
      n49: { type: 'text', text: '어깨가 조금 풀렸다. 칭찬은 짧았고, 짧아서 오히려 오래 남았다.', next: 'n50' },

      n50: {
        type: 'choice',
        prompt: '이 자리에서 무엇을 할까.',
        options: [
          { text: '"일어나." — 오늘은 여기서 끝낸다', next: 'n51', stat: { resist: 1 }, set: { ended_early: true } },
          { text: '"돌아." — 등을 보게 한다', next: 'n53', stat: { obey: 1 }, set: { turned: true } }
        ]
      },

      n51: { type: 'text', speaker: '쿠라', text: '일어나.', next: 'n52' },
      n52: { type: 'text', text: '무릎이 바닥에서 떨어지고 몸이 일어섰다. 그는 앉은 채로 한 걸음 물러나 그 몸을 위에서 아래로 천천히 훑었다.', next: 'n55' },

      n53: { type: 'text', speaker: '쿠라', text: '돌아.', next: 'n54' },
      n54: { type: 'text', text: '몸이 돌았다. 어깨뼈가 조금 튀어나와 있었고, 그 사이로 등 한가운데의 선이 허리까지 내려갔다. 꼬리 끝이 스탠드 빛을 받아 한 점으로 빛났다.', next: 'n55' },

      n55: { type: 'text', text: '무릎을 꿇었던 자리에 붉은 자국이 남아 있었다. 그는 그 몸을 값으로 매기지 않았다. 어디를 오래 볼지 고르고 있었을 뿐이었다.', next: 'n56' },
      n56: { type: 'text', speaker: '쿠라', text: '오늘은 여기까지.', next: 'n57' },
      n57: { type: 'text', text: '명령이 아니라 선언이었다. 그는 목줄을 풀고, 목덜미를 문지르고, 손목을 한 번 잡아 주었다.', next: 'n58' },
      n58: { type: 'text', text: '손목에 붉은 선이 하나 남아 있었고, 목덜미에는 이빨 자국이 있었다. 그는 그 자국을 손끝으로 짚어 보고 나서 물을 가지러 갔다.', next: 'n59' },
      n59: { type: 'text', text: '문을 닫고 나서야 자기 손이 떨리고 있다는 것을 알았다. 명령을 내리는 쪽이 더 떨린다는 것을, 그는 오늘 처음 알았다.', next: 'n60' },

      /* ── 2부 · 도화 시점 ── */
      n60: { type: 'text', bg: 'room_night', speaker: '', text: '도화는 물컵을 들고 있었다. 목이 아직 아팠고, 마시는 동안 손이 등에 얹혀 있었다. 그 손이 무겁지 않았다.', next: 'n61' },
      n61: { type: 'text', text: '사흘 전부터 후배가 작은 것들을 물어 왔다. 저녁 메뉴도, 잠자는 시간도, 내일 입을 옷도. 자기는 그때마다 웃으면서 넘겼다.', next: 'n62' },
      n62: { type: 'text', text: '넘기는 게 어려운 일이 아니었고, 넘기고 나면 다음에 물을 때 대답이 조금 빨라졌다. 빨라지는 것을 자기도 알고 있었다.', next: 'n63' },
      n63: { type: 'text', text: '그건 자기가 허락한 것이었다. 허락한 일이니까 불편하지 않았고, 불편하지 않으니까 또 허락했다.', next: 'n64' },
      n64: { type: 'text', text: '오늘 물어온 것은 작은 것이 아니었다. 맡긴다는 말은 자기가 꺼낸 것 같았지만, 돌아보면 그 말이 나오게 만든 것은 그쪽이었다.', next: 'n65' },
      n65: { type: 'text', text: '하지 않을 것을 자기가 정했다. 조건을 정한 사람이 조건 안에 있는 것은 이상한 일이 아니었다.', next: 'n66' },
      n66: { type: 'text', text: '무릎이라고 했다. 그 한마디 뒤에 아무 말도 오지 않았다. 그 침묵이 길었고, 그 길이만큼 자기가 무엇을 기다리는지 몸이 먼저 알았다.', next: 'n67' },
      n67: { type: 'text', text: '무릎이 닿고 나서도 몇 초를 더 그대로 있어야 했다. 버티던 몸이 몇 번 꿈틀거리다가 바닥에 닿았다.', next: 'n68' },
      n68: { type: 'text', text: '목줄이 풀렸을 때 목덜미가 조금 시원했고, 그 시원함이 아쉬웠다. 손목의 붉은 선을 손끝으로 짚어 보았다. 아프지 않았다. 아프지 않은데도 자꾸 짚게 되었다.', next: 'n69' },
      n69: { type: 'text', text: '내일 아침에도 이 자국이 남아 있을 것이라는 생각이 들었고, 그 생각이 오늘 밤을 내일까지 끌고 갈 것 같았다.', next: 'n70' },
      n70: { type: 'text', text: '창문이 조금 열려 있었고, 커튼이 천천히 움직였다. 둘 다 그 움직임을 잠깐 보았다.', next: 'n71' },
      n71: { type: 'text', text: '자기는 그날 밤, 오늘 외운 말이 자기 것이 되기를 조금 바라고 있었다. 적어도 그날 밤까지는.', next: 'n_end' },

      n_end: { type: 'end', title: '1화 · 맹세 — 끝', text: '오늘 밤 남은 것: 목덜미의 자국 하나, 그리고 외운 문장 한 줄.' }
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = SC;
  global.SUNAE_SCENARIO = SC;
})(typeof window !== 'undefined' ? window : this);


/* 시나리오 데이터 — 2화 「앉아」 (쯔꾸르식)
 * 1화 플래그(firm/soft, twice/once, turned/ended_early)를 이어받는다.

 */
(function (global) {
  'use strict';

  var SC2 = {
    chapter: 2,
    title: '방울 — 2화 · 앉아',
    start: 'm01',
    nodes: {
      /* ── 1부 · 쿠라 시점 ── */
      m01: { type: 'text', bg: 'room_day', speaker: '', text: '초콜릿 하나가 손바닥 위에서 조금 미끄러졌다. 손가락으로 밀어 제자리에 놓았고, 다시 미끄러지는 것을 보고 있었다.', next: 'm02' },
      m02: { type: 'text', text: '방에는 아직 낮의 빛이 남아 있었고, 책상 위 물컵에는 손대지 않은 물이 반쯤 차 있었다. 오늘 할 일은 하나뿐이었다. 앉히고, 기다리게 하고, 먹이는 것.', next: 'm03' },
      m03: { type: 'text', text: '이 장면은 어제 밤에 시작되었다. 자정이 조금 지나서 문자가 왔다. "내일도 그거 해?"', next: 'm04' },
      m04: { type: 'text', text: '바로 답하지 않았다. 답이 빠르면 다음에도 빠를 것이고, 다음에도 빠르면 이 사람은 자기가 무엇을 기다리는지 모르게 될 것이다.', next: 'm05' },
      m05: { type: 'text', bg: 'cafe', text: '다음 날 낮, 학교 앞 카페에서 마주쳤을 때 선배가 먼저 입을 열었다. 컵을 두 손으로 감싸 쥔 채였다.', next: 'm06' },
      m06: { type: 'text', speaker: '도화', text: '어제 그거, 진짜였어?', next: 'm07' },
      m07: { type: 'text', speaker: '쿠라', text: '어제 뭐.', next: 'm08' },
      m08: { type: 'text', speaker: '도화', text: '……맡긴다는 거.', next: 'm09' },
      m09: { type: 'text', speaker: '쿠라', text: '글자로 다시 물어봐. 말로 하면 너도 잊어.', next: 'm10' },
      m10: { type: 'text', text: '선배가 잠깐 이쪽을 보다가 휴대폰을 꺼냈다. 보낸 것은 한 줄이었다. "오늘도 해도 돼?"', next: 'm11' },
      m11: { type: 'text', text: '답이 오기까지 삼십 초쯤 걸렸다. 그 삼십 초 동안 선배는 휴대폰을 뒤집었다 엎었다 했다. 답은 짧았다.', next: 'm12' },
      m12: { type: 'text', speaker: '쿠라', text: '응. 대신 오늘은 앉아.', next: 'm13' },

      m13: { type: 'text', bg: 'room_day', text: '지금, 문이 열렸다. 들어온 사람은 어제와 같은 자리에 섰다. 어제는 서자마자 무릎이 먼저 내려갔는데, 오늘은 내려가지 않았다.', next: 'm14' },
      m14: { type: 'text', text: '명령이 오늘까지 이어지는지 확신하지 못하는 얼굴이었고, 확신하지 못하면서도 몸은 이미 반 발짝 앞으로 와 있었다. 그 반 발짝을 보고 나서야 입을 열었다.', next: 'm15' },
      m15: { type: 'text', speaker: '쿠라', text: '오늘은 앉아.', next: 'm16' },
      m16: { type: 'text', speaker: '도화', text: '……여기?', next: 'm17' },
      m17: { type: 'text', speaker: '쿠라', text: '응. 여기.', next: 'm18' },
      m18: { type: 'text', text: '앉는다는 말이 무릎을 꿇는 것인지 그냥 걸터앉는 것인지 헷갈리는 얼굴이었다. 대답 대신 손가락으로 자기 앞의 바닥을 가리켰다. 가리킨 자리에 앉았고, 앉는 방식이 어색해서 다리를 조금 접었다.', next: 'm19' },
      m19: { type: 'text', speaker: '쿠라', text: '기다려.', next: 'm20' },
      m20: { type: 'text', text: '그 말을 하고서 다른 일을 했다. 종이를 정리하고, 휴대폰을 뒤집어 두고, 물을 한 잔 따라 자기 자리에 두었다. 기다리게 하는 시간은 일부러 길게 잡았다.', next: 'm21' },
      m21: { type: 'text', text: '길게 잡으면 그 시간에 이 사람이 무엇을 하는지 보이기 때문이다. 처음에는 자세를 고쳤고, 그 다음에는 꼬리를 바닥에 둘렀고, 그 다음에는 아무것도 하지 않았다.', next: 'm22' },
      m22: { type: 'text', text: '아무것도 하지 않는 것이 가장 어려운 일이라는 것을 그는 알고 있었다. 어깨가 조금 올라갔다가 내려왔고, 손이 무릎 위에서 한 번 움직였다가 멈췄다.', next: 'm23' },

      m23: { type: 'text', speaker: '쿠라', text: '손.', next: 'm24' },
      m24: {
        type: 'choice',
        prompt: '초콜릿이 손바닥 위에 놓였다. 어떻게 받을까.',
        options: [
          { text: '손을 내밀고 기다린다', next: 'm25', stat: { obey: 1 }, set: { c2_take: true } },
          { text: '손목을 붙잡고 눈을 본다', next: 'm26', stat: { resist: 1 }, set: { c2_hold: true } }
        ]
      },
      m25: { type: 'text', text: '손이 올라왔다. 손바닥을 펴고, 그 위에 놓인 것을 떨어뜨리지 않으려고 손가락을 조금 접었다. 기다리는 동안 손이 아주 조금 떨렸다.', next: 'm27' },
      m26: { type: 'text', text: '손목이 잡혔다. 눈이 올라왔고, 그 눈을 그는 피하지 않았다. 잡힌 손목에 힘이 들어갔다가 풀렸다. 그는 웃지 않았고, 그 웃지 않는 얼굴이 대답이었다.', next: 'm27' },
      m27: { type: 'text', text: '그 손에 초콜릿 하나를 얹어 주었다. 그것을 입에 넣으려 할 때, 그는 손목을 잡아 멈췄다.', next: 'm28' },
      m28: { type: 'text', speaker: '쿠라', text: '내가 줄 때까지 기다려.', next: 'm29' },
      m29: { type: 'text', speaker: '도화', text: '……알겠어.', next: 'm30' },
      m30: { type: 'text', text: '대답이 반 발짝 늦었다. 늦게 나오는 답이 더 좋았다. 늦게 나오는 답은 재어 본 답이었다.', next: 'm31' },
      m31: { type: 'text', speaker: '쿠라', text: '입 벌려.', next: 'm32' },
      m32: { type: 'text', text: '입이 벌어졌다. 초콜릿을 혀 위에 놓고 손을 뺐다. 삼키는 동안 턱을 잡아 올려 목이 움직이는 것을 보았다.', next: 'm33' },
      m33: { type: 'text', speaker: '쿠라', text: '잘 먹었어.', next: 'm34' },
      m34: { type: 'text', text: '머리에 손을 얹고 한 번 쓰다듬었다. 손바닥 아래에서 귀가 조금 접혔고, 접힌 귀가 손을 피하지 않았다. 피하지 않는 것과 좋아하는 것은 다르지만, 피하지 않는 것부터 시작해야 했다.', next: 'm35' },
      m35: { type: 'text', speaker: '쿠라', text: '하나 더.', next: 'm36' },
      m36: { type: 'text', text: '이번에는 스스로 입을 벌렸다. 시키지 않았는데 벌렸고, 벌린 것을 자기가 알아차리고 나서 얼굴이 조금 붉어졌다. 그는 그 붉어짐을 보면서 천천히 초콜릿을 놓았다.', next: 'm37' },
      m37: { type: 'text', text: '초콜릿이 혀 위에 닿았고, 손가락이 혀에 닿았고, 그 손가락이 빠지지 않았다. 삼키려 하자 손가락이 조금 따라 들어왔고, 목이 그것을 밀어냈다.', next: 'm38' },
      m38: { type: 'text', text: '밀어내는 것이 명령을 어기는 것인지 몰라서 몸이 굳었다. 그는 굳은 것을 풀어 주지 않았다. 손가락을 그대로 두고, 눈만 내려다보았다. 몇 초 뒤에 목이 다시 움직였고, 이번에는 밀어내지 않았다.', next: 'm39' },
      m39: { type: 'text', text: '"하아." 아주 작은 소리였다. 그 소리를 들은 사람이 누구인지는 아무도 말하지 않았다.', next: 'm40' },

      m40: { type: 'text', text: '목줄을 꺼내 목덜미에 둘렀다. 버클이 잠기는 소리가 아주 작게 났고, 어제 눌린 자리 위에 가죽이 다시 놓였다.', next: 'm41' },
      m41: { type: 'text', text: '고리를 잡아 조금 당기자 목이 따라 왔고, 턱이 들렸다. 목덜미에 입을 대고 아주 천천히 이빨을 세웠다. 물지 않고 눌렀다가 놓는 것만으로도 어제의 자국 위에 새 자국이 겹쳤다.', next: 'm42' },
      m42: { type: 'text', text: '어깨가 떨렸고, 떨림이 멈추기를 기다린 뒤에 옷깃을 열었다. 손바닥이 가슴을 쓸었다. 어제 남긴 자리가 아직 흐릿하게 보였고, 그 자리 위로 손바닥이 지나가자 숨이 조금 끊겼다.', next: 'm43' },
      m43: { type: 'text', text: '손가락이 그 자리를 스쳤다. 숨이 한 번 멈췄고, 멈춘 숨을 들키지 않으려고 어깨를 조금 낮췄다. 그는 손을 멈추지 않았고, 멈추지 않는 동안 방의 공기가 조금 뜨거워졌다.', next: 'm44' },

      m44: { type: 'text', speaker: '쿠라', text: '이리 와.', next: 'm45' },
      m45: { type: 'text', text: '목줄을 당겨 가까이 끌어왔다. 무릎으로 기어오는 동안 꼬리가 바닥을 쓸었고, 그는 손을 멈추지 않았다.', next: 'm46' },
      m46: { type: 'text', speaker: '쿠라', text: '입.', next: 'm47' },
      m47: { type: 'text', text: '턱을 눌러 입을 벌리고, 머리에 손을 얹되 누르지는 않았다. 입 안의 온도가 올라오고 침이 고이고 턱이 뻐근해지는 것이 손끝으로 전해졌고, 숨소리가 코로만 나왔다.', next: 'm48' },
      m48: { type: 'text', text: '각도를 조금씩 바꿀 때마다 목이 따라왔고, 따라오는 것을 그는 재촉하지 않았다. 사정이 가까워지자 허벅지가 먼저 떨렸다.', next: 'm49' },
      m49: {
        type: 'choice',
        prompt: '고개를 들라는 말이 떨어졌다. 어떻게 할까.',
        options: [
          { text: '그대로 삼킨다', next: 'm50', stat: { obey: 1 }, set: { c2_swallow: true } },
          { text: '고개를 돌린다', next: 'm51', stat: { resist: 1 }, set: { c2_turn: true } }
        ]
      },
      m50: { type: 'text', text: '목이 움직였고, 삼키는 데 두 번, 세 번이 걸렸다. 고개를 들자 무언가가 아직 따라와 있었다. 늘어나고, 가늘어지고, 작게 끊어져 턱에 떨어졌다.', next: 'm52' },
      m51: { type: 'text', text: '고개가 돌아갔다. 그는 멈추지 않았고, 멈추지 않는 것이 오히려 대답이었다. 돌린 얼굴 위로 무언가가 흘렀고, 그것을 닦아 주는 손이 조금 전까지 턱을 잡고 있던 손과 같은 손이었다.', next: 'm52' },
      m52: { type: 'text', text: '손가락이 그것을 닦아 주었다. 닦는 손이 조금 전까지 누르고 있던 손과 같은 손이었다.', next: 'm53' },
      m53: { type: 'text', speaker: '쿠라', text: '오늘은 여기까지.', next: 'm54' },
      m54: { type: 'text', text: '명령이 아니라 선언이었다. 목줄을 풀고 목덜미를 문지르고, 손목의 붉은 선을 확인했다. 어제의 선 위에 오늘의 선이 겹쳐 있었다.', next: 'm55' },
      m55: { type: 'text', text: '그 선을 손끝으로 짚어 보고 나서 물을 가지러 갔다. 돌아와서 옆자리에 앉았다. 어깨가 닿을 정도의 거리였고, 그 거리에서 아무 말도 하지 않았다.', next: 'm56' },

      /* ── 2부 · 도화 시점 (속마음) ── */
      m56: { type: 'text', bg: 'room_day', speaker: '', text: '바닥에 앉아 있었다. 들어오자마자 무릎을 꿇으려 했는데, 앉으라는 말이 먼저 나왔다.', next: 'm57' },
      m57: { type: 'text', text: '앉으라는 말이 무릎을 꿇으라는 뜻인지 아닌지 헷갈렸고, 헷갈리는 동안 손가락이 바닥을 가리켰다. 가리킨 자리에 앉았을 때, 자기는 자기가 앉은 것이라고 생각했다.', next: 'm58' },
      m58: { type: 'text', text: '시킨 대로 앉았지만 앉기로 한 것은 자기가 아니었나. 그 물음이 오래 남았다.', next: 'm59' },
      m59: { type: 'text', text: '기다리라는 말 뒤에 그는 다른 일을 했다. 기다리는 동안 자세를 고치고, 꼬리를 바닥에 두르고, 그 다음에는 아무것도 하지 않았다. 아무것도 하지 않는 것이 이렇게 어려운 일인 줄 몰랐다.', next: 'm60' },
      m60: { type: 'text', text: '어렵다는 것을 들키고 싶지 않아서 손을 무릎 위에 얹었다. 얹은 손이 자꾸 움직여서 다시 얹었다.', next: 'm61' },
      m61: { type: 'text', text: '손에 초콜릿이 얹혔다. 입에 넣으려는데 손목이 잡혔다. 기다리라는 말이 떨어졌고, 자기는 알겠다고 답했다. 답이 나오는 것이 반 발짝 늦었다.', next: 'm62' },
      m62: { type: 'text', text: '늦게 나온 답이 자기가 정한 답인지 시킨 대로 나온 답인지 그때는 구분하지 않았다. 입이 벌어지고 초콜릿이 혀 위에 놓였다. 삼키는 동안 턱이 잡혔고, 잡힌 턱이 올라가서 목이 드러났다.', next: 'm63' },
      m63: { type: 'text', text: '목이 움직이는 것을 누가 보고 있다는 것이 부끄러웠다. 머리에 손이 얹히고 한 번 쓰다듬어졌다. 귀가 접혔고, 접힌 귀가 손을 피하지 않았다.', next: 'm64' },
      m64: { type: 'text', text: '피하지 않는 것이 좋다는 뜻은 아니었다. 다만 피하고 싶지 않았다. 그 정도는 자기가 정할 수 있었다.', next: 'm65' },
      m65: { type: 'text', text: '하나 더 하라고 했다. 이번에는 입이 먼저 벌어졌다. 시키지 않았는데 벌어졌고, 벌어진 것을 자기가 알아차리고 나서 얼굴이 뜨거워졌다.', next: 'm66' },
      m66: { type: 'text', text: '손가락이 혀에 닿았고, 그 손가락이 빠지지 않았다. 삼키려 하자 손가락이 조금 따라 들어왔고, 목이 그것을 밀어냈다. 밀어내는 것이 명령을 어기는 것인지 몰라서 몸이 굳었다.', next: 'm67' },
      m67: { type: 'text', text: '굳은 것을 그는 풀어 주지 않았다. 손가락을 그대로 두고 눈만 내려다보았다. 몇 초 뒤에 목이 다시 움직였고, 이번에는 밀어내지 않았다. 밀어내지 않은 것이 자기가 결정한 것인지, 그냥 몸이 그렇게 한 것인지 알 수 없었다. 알 수 없는 채로 넘어갔다.', next: 'm68' },
      m68: { type: 'text', text: '목줄이 목덜미에 놓였다. 어제 눌린 자리 위에 가죽이 다시 닿았고, 버클이 잠기는 소리가 아주 작았다. 고리가 당겨졌다. 목이 따라 갔고, 턱이 들렸다.', next: 'm69' },
      m69: { type: 'text', text: '목덜미에 입이 닿았고, 이빨이 아주 천천히 세워졌다. 어제의 자국 위에 새 자국이 겹치는 것이 느껴졌다. 열이 남았고, 어깨가 떨렸고, 떨림이 멈추기를 기다리는 시간이 있었다. 그 시간에 자기는 자기가 떨고 있는 것을 들키고 있었다.', next: 'm70' },
      m70: { type: 'text', text: '옷깃이 열리고 손바닥이 가슴을 쓸었다. 어제 남긴 자리 위로 손바닥이 지나가자 숨이 끊겼다. 굳어지는 것을 들키는 게 부끄러웠다. 공기가 그 자리를 지나갈 때마다 차가운 것이 남았다.', next: 'm71' },
      m71: { type: 'text', text: '이리 오라고 했다. 목줄이 당겨졌고, 무릎으로 기어오는 동안 꼬리가 바닥을 쓸었다. 손이 멈추지 않았고, 멈추지 않는 것이 무서웠다. 무섭지 않다고 생각했다.', next: 'm72' },
      m72: { type: 'text', text: '턱이 눌려 입이 벌어졌다. 턱이 뻐근해지고, 목이 눌려서 코로 숨을 몰아쉬었으며, 머리에 얹힌 손이 누르지 않는 것이 오히려 더 무서웠다. 각도가 바뀔 때마다 목이 따라갔고, 따라가는 것을 멈출 수 없었다.', next: 'm73' },
      m73: { type: 'text', text: '끝이 오기 전에 허벅지가 떨리는 것이 먼저 느껴졌다. 그 다음에 온도가 올라왔고, 목 안쪽이 먼저 알아차렸다. 삼키는 데 두 번, 세 번이 걸렸다. 따뜻한 것이 목을 지나간 자리가 한동안 남았다.', next: 'm74' },
      m74: { type: 'text', text: '고개를 들었을 때 무언가가 아직 따라와 있었다. 손가락이 입가를 닦아 주었다. 닦는 손이 조금 전까지 자기를 누르고 있던 손과 같은 손이었다.', next: 'm75' },
      m75: { type: 'text', text: '목줄이 풀렸을 때 목덜미가 조금 시원했고, 그 시원함이 아쉬웠다. 손목의 붉은 선은 어제의 선 위에 오늘의 선이 겹쳐 있었다. 짚어 보았고, 아프지 않았다.', next: 'm76' },
      m76: { type: 'text', text: '어깨가 닿을 만한 거리에 그가 앉았다. 아무 말도 하지 않았고, 자기도 아무 말도 하지 않았다.', next: 'm77' },
      m77: { type: 'text', text: '그런데 오늘은 어제와 달랐다. 오늘은 자기가 먼저 물었다. 문자로, 두 번. 답이 오기까지 삼십 초를 세었고, 세는 동안 휴대폰을 뒤집었다 엎었다 했다.', next: 'm78' },
      m78: { type: 'text', text: '그 삼십 초가 자기가 이 일을 원한다는 증거였다. 원한다는 것을 자기가 먼저 적어서 보냈다. 그 사실이 오늘 하루를 조금 다르게 만들었다.', next: 'm79' },
      m79: { type: 'text', text: '세는 동안 자기는 오늘 앉은 것도, 기다린 것도, 먹은 것도 자기 허락으로 한 일이라고 생각했다. 그 생각이 틀리지 않았다. 적어도 그날 밤까지는.', next: 'm_end' },

      m_end: { type: 'end', title: '2화 · 앉아 — 끝', text: '오늘 남은 것: 겹친 자국 둘, 그리고 스스로 적어 보낸 문장 한 줄.' }
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = SC2;
  global.SUNAE_SCENARIO2 = SC2;
})(typeof window !== 'undefined' ? window : this);

  function markRead(id) {
    if (readSet[id]) return false;
    readSet[id] = 1;
    try { localStorage.setItem(READ_KEY, JSON.stringify(Object.keys(readSet))); } catch (e) {}
    return true;
  }

  /* ── 엔딩 기록 ── */
  var seenEndings = {};
  try { seenEndings = JSON.parse(localStorage.getItem(END_KEY) || '{}') || {}; } catch (e) { seenEndings = {}; }

  function endingKey(st) {
    var f = st.flags || {};
    if ((st.chapter || 1) === 2) {
      var t = f.c2_take ? 'take' : (f.c2_hold ? 'hold' : null);
      var s = f.c2_swallow ? 'swallow' : (f.c2_turn ? 'turn' : null);
      return t && s ? 'c2-' + t + '-' + s : null;
    }
    var a = f.firm ? 'firm' : (f.soft ? 'soft' : null);
    var b = f.twice ? 'twice' : (f.once ? 'once' : null);
    var c = f.turned ? 'turned' : (f.ended_early ? 'ended_early' : null);
    return a && b && c ? a + '-' + b + '-' + c : null;
  }
  function endingDef(key) {
    for (var i = 0; i < ENDINGS.length; i++) if (ENDINGS[i].key === key) return ENDINGS[i];
    return null;
  }
  function markEnding(key) {
    if (!key || seenEndings[key]) return;
    seenEndings[key] = Date.now();
    try { localStorage.setItem(END_KEY, JSON.stringify(seenEndings)); } catch (e) {}
  }
  function endingCount() { return Object.keys(seenEndings).length; }

  /* ── 효과음 (WebAudio 합성, 외부 파일 없음) ── */
  var actx = null;
  function tone(freq, dur, type, gain, when) {
    var t0 = actx.currentTime + (when || 0);
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function sfx(kind) {
    if (!SETTINGS.sfx) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      if (kind === 'adv') tone(700, 0.05, 'triangle', 0.035);
      else if (kind === 'pick') { tone(520, 0.06, 'triangle', 0.04); tone(780, 0.08, 'triangle', 0.035, 0.06); }
      else if (kind === 'save') { tone(660, 0.07, 'sine', 0.04); tone(880, 0.09, 'sine', 0.035, 0.07); }
      else if (kind === 'end') { tone(392, 0.5, 'sine', 0.05); tone(494, 0.5, 'sine', 0.04, 0.02); tone(587, 0.6, 'sine', 0.035, 0.04); }
    } catch (e) { /* 소리 실패는 무시 */ }
  }

  /* ── 배경음 (합성 앰비언트, 파일 없음 · 기본 꺼짐) ── */
  var bgm = null;
  function ensureAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function startBgm() {
    if (bgm || !SETTINGS.bgm) return;
    try {
      ensureAudio();
      var master = actx.createGain();
      master.gain.setValueAtTime(0.0001, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.028, actx.currentTime + 4);
      master.connect(actx.destination);
      var nodes = [146.83, 174.61, 220.00, 293.66].map(function (f, i) {
        var o = actx.createOscillator();
        o.type = i % 2 ? 'sine' : 'triangle';
        o.frequency.value = f;
        var g = actx.createGain();
        g.gain.value = 0.22;
        var lfo = actx.createOscillator();
        lfo.frequency.value = 0.045 + i * 0.017;
        var lg = actx.createGain();
        lg.gain.value = 0.13;
        lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(master);
        o.start(); lfo.start();
        return [o, lfo];
      });
      bgm = { master: master, nodes: nodes };
    } catch (e) { bgm = null; }
  }
  function stopBgm() {
    if (!bgm) return;
    try {
      var b = bgm;
      b.master.gain.cancelScheduledValues(actx.currentTime);
      b.master.gain.setValueAtTime(b.master.gain.value, actx.currentTime);
      b.master.gain.linearRampToValueAtTime(0.0001, actx.currentTime + 0.8);
      setTimeout(function () {
        b.nodes.forEach(function (n) { try { n[0].stop(); n[1].stop(); } catch (e) {} });
      }, 900);
    } catch (e) {}
    bgm = null;
  }

  /* ── 배경/이미지 ── */
  function setBg(key) {
    if (!key) return;
    el.bg.className = 'bg bg-' + key;
  }
  function setCg(src) {
    if (!src) { el.cg.classList.remove('on'); el.cg.removeAttribute('src'); return; }
    el.cg.src = src;
    el.cg.classList.add('on');
  }

  /* ── 타이핑 ── */
  function typeOut(str, done) {
    stopTyping();
    el.text.textContent = '';
    var i = 0;
    typing = setInterval(function () {
      i += CHARS_PER_TICK;
      el.text.textContent = str.slice(0, i);
      if (i >= str.length) { stopTyping(); done && done(); }
    }, SETTINGS.tick);
  }
  function showInstant(str) {
    stopTyping();
    el.text.textContent = str;
  }
  function stopTyping() { if (typing) { clearInterval(typing); typing = null; } }
  function isTyping() { return !!typing; }
  function finishTyping() {
    stopTyping();
    el.text.textContent = el.text.dataset.full || '';
    scheduleNext();
  }

  function scheduleNext() {
    clearTimeout(autoTimer);
    clearTimeout(skipTimer);
    if (skipOn) {
      skipTimer = setTimeout(function () { advance(); }, 80);
      return;
    }
    if (!autoOn) return;
    autoTimer = setTimeout(function () { advance(); }, SETTINGS.autoDelay);
  }
  function scheduleAuto() { scheduleNext(); }

  /* ── 스킵 ── */
  function setSkip(on) {
    skipOn = on;
    var btn = document.getElementById('btn-skip');
    if (btn) btn.classList.toggle('on', on);
    if (on) { clearTimeout(autoTimer); scheduleNext(); }
    else clearTimeout(skipTimer);
  }
  function stopSkip() { if (skipOn) setSkip(false); }

  /* ── 렌더 ── */
  function render() {
    var n = CORE.node(SC, state);
    el.endPanel.classList.remove('on');
    el.box.classList.remove('hide');
    el.choices.innerHTML = '';
    el.choices.classList.remove('on');

    if (n.type === 'end') { renderEnd(n); return; }

    if (n.bg) setBg(n.bg);
    if ('cg' in n) setCg(n.cg);
    var pSrc = PORTRAITS[n.speaker];
    if (pSrc) {
      if (el.portrait.getAttribute('src') !== pSrc) el.portrait.src = pSrc;
      el.portrait.classList.add('on');
    } else {
      el.portrait.classList.remove('on');
    }
    el.name.textContent = n.speaker || '';
    el.name.classList.toggle('on', !!n.speaker);

    var wasRead = !!readSet[state.id];
    markRead(state.id);

    if (n.type === 'text') {
      el.text.dataset.full = n.text;
      log.push({ speaker: n.speaker || '', text: n.text });
      if (wasRead || skipOn) { showInstant(n.text); scheduleNext(); }
      else { stopSkip(); typeOut(n.text, scheduleNext); }
    } else if (n.type === 'choice') {
      stopSkip();
      el.text.dataset.full = n.prompt || '……';
      if (wasRead) { showInstant(n.prompt || '……'); showChoices(); }
      else typeOut(n.prompt || '……', function () { showChoices(); });
    }
    el.hint.textContent = n.type === 'choice' ? '선택지를 고르세요'
      : (wasRead ? '읽은 대사 · 클릭 또는 Space' : '클릭 또는 Space');
  }

  function showChoices() {
    var list = CORE.choices(SC, state);
    el.choices.innerHTML = '';
    list.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'choice';
      b.textContent = o.text;
      b.addEventListener('click', function (ev) { ev.stopPropagation(); pick(o.index); });
      el.choices.appendChild(b);
    });
    el.choices.classList.add('on');
    clearTimeout(autoTimer);
  }

  function renderEnd(n) {
    el.name.textContent = '';
    el.name.classList.remove('on');
    el.text.dataset.full = '';
    el.text.textContent = '';
    el.box.classList.add('hide');
    el.portrait.classList.remove('on');
    var key = endingKey(state);
    var def = endingDef(key);
    markEnding(key);
    el.endTitle.textContent = def ? def.title : (n.title || '끝');
    el.endText.textContent = (n.title ? n.title + '\n\n' : '') + (n.text || '');
    var chTitle = chapterTitle(state.chapter || 1);
    el.endStats.textContent = (chTitle ? chTitle + ' · ' : '') +
      '엔딩 ' + endingCount() + '/' + ENDINGS.length +
      ' · 복종 ' + state.stats.obey + ' · 저항 ' + state.stats.resist +
      ' · 지나온 장면 ' + state.visited.length;
    var nx = nextChapter(state.chapter || 1);
    el.btnNext.style.display = nx ? '' : 'none';
    el.btnNext.textContent = nx ? '다음 화 — ' + nx.title : '다음 화';
    el.endPanel.classList.add('on');
    el.hint.textContent = nx ? '다음 화로 이어서 진행할 수 있어요' : '다시 시작하거나 저장된 지점을 불러오세요';
    clearTimeout(autoTimer);
    stopSkip();
    sfx('end');
  }

  function chapterTitle(id) {
    var ch = (SC.chapters || []).filter(function (c) { return c.id === id; })[0];
    return ch ? ch.title : '';
  }
  function nextChapter(id) {
    var chs = SC.chapters || [];
    for (var i = 0; i < chs.length; i++) if (chs[i].id === id) return chs[i + 1] || null;
    return null;
  }
  function goNextChapter() {
    var nx = nextChapter(state.chapter || 1);
    if (!nx) return;
    stopSkip();
    clearTimeout(autoTimer);
    var ns = CORE.clone(state);
    ns.id = nx.start;
    ns.chapter = nx.id;
    state = ns;
    log = [];
    closePanel();
    render();
    flash(nx.id + '화 — ' + nx.title);
  }

  /* ── 진행 ── */
  function advance() {
    if (el.panel.classList.contains('on')) return;
    if (isTyping()) { finishTyping(); return; }
    var n = CORE.node(SC, state);
    if (n.type === 'choice' || n.type === 'end') { stopSkip(); return; }
    state = CORE.advance(SC, state);
    sfx('adv');
    render();
  }

  function pick(index) {
    var n = CORE.node(SC, state);
    var label = (n.options[index] || {}).text || '';
    state = CORE.choose(SC, state, index);
    log.push({ speaker: '▶ 선택', text: label });
    sfx('pick');
    render();
  }

  /* ── 장면 이름 (슬롯 표시용) ── */
  function sceneLabel(st) {
    try {
      var n = CORE.node(SC, st);
      var t = n.type === 'end' ? (n.title || '엔딩') : (n.text || n.prompt || '');
      t = String(t).replace(/\s+/g, ' ').trim();
      if (t.length > 22) t = t.slice(0, 22) + '…';
      return (n.speaker ? n.speaker + ': ' : '') + t;
    } catch (e) { return '알 수 없는 장면'; }
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    function p(v) { return (v < 10 ? '0' : '') + v; }
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ── 저장 슬롯 ── */
  function slotGet(i) {
    try { return JSON.parse(localStorage.getItem(SLOT_PREFIX + i) || 'null'); } catch (e) { return null; }
  }
  function saveToSlot(i) {
    try {
      var d = {
        state: state, log: log, at: Date.now(),
        scene: sceneLabel(state), chapter: SC.title
      };
      localStorage.setItem(SLOT_PREFIX + i, JSON.stringify(d));
      sfx('save');
      flash('슬롯 ' + i + '에 저장했습니다');
      renderPanel();
    } catch (e) { flash('저장 실패: ' + e.message); }
  }
  function loadFromSlot(i) {
    var d = slotGet(i);
    if (!d || !d.state) { flash('슬롯 ' + i + '이 비어 있습니다'); return; }
    try {
      stopSkip();
      clearTimeout(autoTimer);
      state = d.state; log = d.log || [];
      closePanel();
      render();
      flash('슬롯 ' + i + '에서 불러왔습니다');
    } catch (e) { flash('불러오기 실패'); }
  }
  function deleteSlot(i) {
    try { localStorage.removeItem(SLOT_PREFIX + i); } catch (e) {}
    flash('슬롯 ' + i + '을 지웠습니다');
    renderPanel();
  }
  function save() { openPanel('save'); }
  function load() { openPanel('load'); }
  function restart() {
    stopSkip();
    clearTimeout(autoTimer);
    state = CORE.start(SC); log = []; render();
    flash('처음부터');
  }

  function flash(msg) {
    el.hint.textContent = msg;
  }

  /* ── 패널 ── */
  var panelMode = null;

  function openPanel(mode) {
    panelMode = mode;
    renderPanel();
    el.panel.classList.add('on');
  }
  function closePanel() {
    el.panel.classList.remove('on');
    panelMode = null;
  }

  function renderPanel() {
    el.panelBody.innerHTML = '';
    if (panelMode === 'save' || panelMode === 'load') renderSlots();
    else if (panelMode === 'settings') renderSettings();
    else if (panelMode === 'endings') renderEndings();
  }

  function mkRow(cls) {
    var d = document.createElement('div');
    d.className = cls;
    return d;
  }

  function renderSlots() {
    el.panelTitle.textContent = panelMode === 'save' ? '저장 — 슬롯 선택' : '불러오기 — 슬롯 선택';
    for (var i = 1; i <= SLOT_COUNT; i++) {
      (function (idx) {
        var d = slotGet(idx);
        var row = mkRow('slot');
        var main = document.createElement('button');
        main.className = 'slot-main';
        if (d) {
          var label = document.createElement('span');
          label.className = 'slot-no';
          label.textContent = '슬롯 ' + idx;
          var info = document.createElement('span');
          info.className = 'slot-info';
          info.textContent = fmtTime(d.at) + ' · ' + (d.scene || '기록');
          main.appendChild(label); main.appendChild(info);
        } else {
          main.classList.add('empty');
          main.textContent = '슬롯 ' + idx + ' · 비어 있음';
        }
        if (panelMode === 'load' && !d) main.disabled = true;
        main.addEventListener('click', function () {
          if (panelMode === 'save') saveToSlot(idx); else loadFromSlot(idx);
        });
        row.appendChild(main);
        if (d) {
          var del = document.createElement('button');
          del.className = 'slot-del';
          del.textContent = '지우기';
          del.addEventListener('click', function () { deleteSlot(idx); });
          row.appendChild(del);
        }
        el.panelBody.appendChild(row);
      })(i);
    }
    var note = document.createElement('p');
    note.className = 'panel-note';
    note.textContent = '저장은 이 브라우저에만 남습니다. 시각은 기기 시간 기준이에요.';
    el.panelBody.appendChild(note);
  }

  function renderSettings() {
    el.panelTitle.textContent = '설정';

    /* 글자 크기 */
    var fsRow = mkRow('set-row');
    var fsLabel = document.createElement('span');
    fsLabel.className = 'set-label';
    fsLabel.textContent = '글자 크기';
    var fsCtrl = mkRow('set-ctrl');
    var minus = document.createElement('button');
    minus.textContent = '작게';
    var fsVal = document.createElement('span');
    fsVal.className = 'set-val';
    fsVal.textContent = Math.round(SETTINGS.fs * 100) + '%';
    var plus = document.createElement('button');
    plus.textContent = '크게';
    minus.addEventListener('click', function () {
      SETTINGS.fs = Math.max(0.8, Math.round((SETTINGS.fs - 0.1) * 10) / 10);
      saveSettings(); applySettings(); fsVal.textContent = Math.round(SETTINGS.fs * 100) + '%';
    });
    plus.addEventListener('click', function () {
      SETTINGS.fs = Math.min(1.5, Math.round((SETTINGS.fs + 0.1) * 10) / 10);
      saveSettings(); applySettings(); fsVal.textContent = Math.round(SETTINGS.fs * 100) + '%';
    });
    fsCtrl.appendChild(minus); fsCtrl.appendChild(fsVal); fsCtrl.appendChild(plus);
    fsRow.appendChild(fsLabel); fsRow.appendChild(fsCtrl);
    el.panelBody.appendChild(fsRow);

    /* 자동 속도 */
    var spRow = mkRow('set-row');
    var spLabel = document.createElement('span');
    spLabel.className = 'set-label';
    spLabel.textContent = '자동 속도';
    var spCtrl = mkRow('set-ctrl seg');
    [[3200, '느리게'], [2200, '보통'], [1400, '빠르게']].forEach(function (p) {
      var b = document.createElement('button');
      b.textContent = p[1];
      if (SETTINGS.autoDelay === p[0]) b.classList.add('on');
      b.addEventListener('click', function () {
        SETTINGS.autoDelay = p[0];
        saveSettings();
        spCtrl.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      spCtrl.appendChild(b);
    });
    spRow.appendChild(spLabel); spRow.appendChild(spCtrl);
    el.panelBody.appendChild(spRow);

    /* 텍스트 속도 */
    var tkRow = mkRow('set-row');
    var tkLabel = document.createElement('span');
    tkLabel.className = 'set-label';
    tkLabel.textContent = '텍스트 속도';
    var tkCtrl = mkRow('set-ctrl seg');
    [[34, '느리게'], [22, '보통'], [10, '빠르게'], [0, '즉시']].forEach(function (p) {
      var b = document.createElement('button');
      b.textContent = p[1];
      if (SETTINGS.tick === p[0]) b.classList.add('on');
      b.addEventListener('click', function () {
        SETTINGS.tick = p[0];
        saveSettings();
        tkCtrl.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      tkCtrl.appendChild(b);
    });
    tkRow.appendChild(tkLabel); tkRow.appendChild(tkCtrl);
    el.panelBody.appendChild(tkRow);

    /* 효과음 */
    var sfxRow = mkRow('set-row');
    var sfxLabel = document.createElement('span');
    sfxLabel.className = 'set-label';
    sfxLabel.textContent = '효과음';
    var sfxCtrl = mkRow('set-ctrl seg');
    var onBtn = document.createElement('button');
    onBtn.textContent = '켜짐';
    var offBtn = document.createElement('button');
    offBtn.textContent = '꺼짐';
    function paintSfx() {
      onBtn.classList.toggle('on', SETTINGS.sfx);
      offBtn.classList.toggle('on', !SETTINGS.sfx);
    }
    onBtn.addEventListener('click', function () { SETTINGS.sfx = true; saveSettings(); paintSfx(); sfx('pick'); });
    offBtn.addEventListener('click', function () { SETTINGS.sfx = false; saveSettings(); paintSfx(); });
    paintSfx();
    sfxCtrl.appendChild(onBtn); sfxCtrl.appendChild(offBtn);
    sfxRow.appendChild(sfxLabel); sfxRow.appendChild(sfxCtrl);
    el.panelBody.appendChild(sfxRow);

    /* 배경음 */
    var bgRow = mkRow('set-row');
    var bgLabel = document.createElement('span');
    bgLabel.className = 'set-label';
    bgLabel.textContent = '배경음';
    var bgCtrl = mkRow('set-ctrl seg');
    var bgOn = document.createElement('button');
    bgOn.textContent = '켜짐';
    var bgOff = document.createElement('button');
    bgOff.textContent = '꺼짐';
    function paintBgm() {
      bgOn.classList.toggle('on', SETTINGS.bgm);
      bgOff.classList.toggle('on', !SETTINGS.bgm);
    }
    bgOn.addEventListener('click', function () {
      SETTINGS.bgm = true; saveSettings(); paintBgm(); startBgm();
    });
    bgOff.addEventListener('click', function () {
      SETTINGS.bgm = false; saveSettings(); paintBgm(); stopBgm();
    });
    paintBgm();
    bgCtrl.appendChild(bgOn); bgCtrl.appendChild(bgOff);
    bgRow.appendChild(bgLabel); bgRow.appendChild(bgCtrl);
    el.panelBody.appendChild(bgRow);

    var note = document.createElement('p');
    note.className = 'panel-note';
    note.textContent = '설정은 바로 적용되고 이 브라우저에 저장됩니다.';
    el.panelBody.appendChild(note);
  }

  function renderEndings() {
    el.panelTitle.textContent = '엔딩 목록 — ' + endingCount() + '/' + ENDINGS.length;
    ALL_ENDINGS.forEach(function (e, i) {
      var seen = seenEndings[e.key];
      var chNo = i < CH_ENDINGS[1].length ? 1 : 2;
      var row = mkRow('ending' + (seen ? '' : ' locked'));
      var no = document.createElement('span');
      no.className = 'ending-no';
      no.textContent = chNo + '-' + (('0' + ((i % CH_ENDINGS[chNo].length) + 1)).slice(-2));
      var body = document.createElement('span');
      body.className = 'ending-body';
      var t = document.createElement('span');
      t.className = 'ending-title';
      t.textContent = seen ? e.title : '??? — 아직 못 봄';
      var s = document.createElement('span');
      s.className = 'ending-sub';
      s.textContent = seen ? '획득 ' + fmtTime(seen) + ' · ' + e.hint : '조건: ' + e.hint;
      body.appendChild(t); body.appendChild(s);
      row.appendChild(no); row.appendChild(body);
      el.panelBody.appendChild(row);
    });
    var note = document.createElement('p');
    note.className = 'panel-note';
    note.textContent = '1화 8종(단호/물러섬 · 두 번/한 번 · 돌아/일어나) + 2화 4종(받아들임/붙잡음 · 삼킴/돌림).';
    el.panelBody.appendChild(note);
  }

  /* ── 백로그 ── */
  function openBacklog() {
    el.backlogList.innerHTML = '';
    log.forEach(function (l) {
      var d = document.createElement('div');
      d.className = 'bl-row';
      var who = document.createElement('span');
      who.className = 'bl-name';
      who.textContent = l.speaker || '';
      var tx = document.createElement('span');
      tx.textContent = l.text;
      d.appendChild(who); d.appendChild(tx);
      el.backlogList.appendChild(d);
    });
    var cnt = document.getElementById('backlogcount');
    if (cnt) cnt.textContent = '백로그 · ' + log.length + '줄';
    el.backlog.classList.add('on');
    el.backlog.scrollTop = el.backlog.scrollHeight;
  }
  function closeBacklog() { el.backlog.classList.remove('on'); }

  /* ── 입력 ── */
  el.stage.addEventListener('click', function (e) {
    if (e.target.closest('#toolbar') || e.target.closest('#choices') ||
        e.target.closest('#backlog') || e.target.closest('#panel') ||
        e.target.closest('#endpanel')) return;
    advance();
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
    if (e.key === 'Escape') { closeBacklog(); closePanel(); }
    if (e.key === 's' || e.key === 'S') { document.getElementById('btn-skip').click(); }
    if (e.key === 'a' || e.key === 'A') { document.getElementById('btn-auto').click(); }
  });

  document.getElementById('btn-save').addEventListener('click', function (e) { e.stopPropagation(); save(); });
  document.getElementById('btn-load').addEventListener('click', function (e) { e.stopPropagation(); load(); });
  document.getElementById('btn-log').addEventListener('click', function (e) { e.stopPropagation(); openBacklog(); });
  document.getElementById('btn-endings').addEventListener('click', function (e) { e.stopPropagation(); openPanel('endings'); });
  document.getElementById('btn-settings').addEventListener('click', function (e) { e.stopPropagation(); openPanel('settings'); });
  document.getElementById('btn-restart').addEventListener('click', function (e) { e.stopPropagation(); restart(); });
  document.getElementById('btn-auto').addEventListener('click', function (e) {
    e.stopPropagation();
    autoOn = !autoOn;
    this.classList.toggle('on', autoOn);
    if (autoOn) { stopSkip(); if (!isTyping()) scheduleNext(); }
    else clearTimeout(autoTimer);
  });
  document.getElementById('btn-skip').addEventListener('click', function (e) {
    e.stopPropagation();
    if (skipOn) setSkip(false);
    else {
      autoOn = false;
      document.getElementById('btn-auto').classList.remove('on');
      clearTimeout(autoTimer);
      setSkip(true);
    }
  });
  document.getElementById('btn-backlog-close').addEventListener('click', function (e) {
    e.stopPropagation(); closeBacklog();
  });
  document.getElementById('panel-close').addEventListener('click', function (e) { e.stopPropagation(); closePanel(); });
  el.panel.addEventListener('click', function (e) {
    if (e.target === el.panel) closePanel();
  });
  el.backlog.addEventListener('click', function (e) {
    if (e.target === el.backlog) closeBacklog();
  });
  document.getElementById('btn-end-restart').addEventListener('click', function (e) { e.stopPropagation(); restart(); });
  el.btnNext.addEventListener('click', function (e) { e.stopPropagation(); goNextChapter(); });
  document.getElementById('btn-end-list').addEventListener('click', function (e) { e.stopPropagation(); openPanel('endings'); });
  document.getElementById('btn-end-load').addEventListener('click', function (e) { e.stopPropagation(); load(); });

  /* ── 시작 ── */
  applySettings();
  if (SETTINGS.bgm) {
    document.addEventListener('pointerdown', function once() {
      document.removeEventListener('pointerdown', once);
      startBgm();
    });
  }
  var errs = CORE.validate(SC);
  if (errs.length) {
    el.text.textContent = '시나리오 오류: ' + errs.join(' / ');
    return;
  }

  /* 옛 단일 저장을 슬롯 1로 옮긴다 */
  try {
    var legacy = localStorage.getItem(LEGACY_SAVE);
    if (legacy && !localStorage.getItem(SLOT_PREFIX + 1)) {
      var ld = JSON.parse(legacy);
      if (ld && ld.state) {
        localStorage.setItem(SLOT_PREFIX + 1, JSON.stringify({
          state: ld.state, log: ld.log || [], at: ld.at || Date.now(),
          scene: sceneLabel(ld.state), chapter: SC.title
        }));
      }
    }
  } catch (e) {}

  state = CORE.start(SC);
  /* 디버그/테스트용: index.html?start=n15&flags={"twice":true} */
  try {
    var qs = new URLSearchParams(location.search);
    var at = qs.get('start');
    if (at && SC.nodes[at]) { state.id = at; state.chapter = at.charAt(0) === 'm' ? 2 : 1; }
    var fl = qs.get('flags');
    if (fl) state.flags = JSON.parse(fl);
  } catch (e) { /* 무시 */ }
  render();
})();

</script>
</body>
</html>
